<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>사내 디지털 사이니지</title>
  <style>
    /* OLED 패널 최적화: 완벽한 블랙(#000) 배경으로 전력 절감 및 레터박스 일체화 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Pretendard", sans-serif;
    }

    body.hide-cursor {
      cursor: none;
    }

    #container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 사진 렌더러: 무보정 고화질 원본 비율 유지 */
    .media-item {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
      background-color: #000000;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: high-quality;
    }

    .media-item.active {
      opacity: 1;
      z-index: 10;
    }

    /* 상단 정보바 (로고/문구, 시계, 날짜) */
    #overlay-header {
      position: absolute;
      top: 24px;
      left: 32px;
      right: 32px;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      color: rgba(255, 255, 255, 0.88);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
      transition: transform 1s ease;
    }

    #logo-container {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    #clock-container {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    #digital-clock {
      font-size: 38px;
      font-weight: 700;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
    }

    #date-display {
      font-size: 16px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.72);
      margin-top: 4px;
    }

    /* 하단 진행 상태 바 (3초 표시) */
    #progress-bar-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background-color: rgba(255, 255, 255, 0.1);
      z-index: 100;
      pointer-events: none;
    }

    #progress-bar {
      width: 0%;
      height: 100%;
      background-color: #3b82f6;
      transition: width 0.1s linear;
    }

    #fullscreen-hint {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 1s;
    }
  </style>
</head>
<body>

  <div id="container">
    <img id="image-layer-a" class="media-item" alt="공지 이미지">
    <img id="image-layer-b" class="media-item" alt="공지 이미지">

    <!-- LG TV 스크린세이버 방지용 1px 무음 비디오 루프 -->
    <video id="keep-alive-video" autoplay loop muted playsinline style="position:fixed;bottom:0;right:0;width:1px;height:1px;opacity:0.01;pointer-events:none;z-index:-1;"></video>

    <div id="overlay-header">
      <div id="logo-container">🏢 사내 공지 게시판</div>
      <div id="clock-container">
        <div id="digital-clock">00:00</div>
        <div id="date-display">2026.00.00 (월)</div>
      </div>
    </div>

    <div id="progress-bar-container">
      <div id="progress-bar"></div>
    </div>

    <div id="fullscreen-hint" onclick="toggleFullScreen()">
      ⛶ 화면을 더블클릭하면 전체화면이 됩니다
    </div>
  </div>

  <script>
    const CONFIG = {
      imageDuration: 7000,   // 사진 7초 전환
      showClock: true,
      showProgressBar: true,
      autoReloadMinutes: 30, // 30분마다 자동 새로고침 (새 사진 반영 & 메모리 청소)
    };

    // 현재 등록된 사진 목록
    const PLAYLIST = [
      { type: 'image', src: 'media/slide_01.jpg?v=1792982472' },
      { type: 'image', src: 'media/slide_02.jpg?v=1792982472' },
      { type: 'image', src: 'media/slide_03.jpg?v=1792982472' },
      { type: 'image', src: 'media/slide_04.jpg?v=1792982472' },
      { type: 'image', src: 'media/slide_05.jpg?v=1792982472' },
      { type: 'image', src: 'media/slide_06.jpg?v=1792982472' },
      { type: 'image', src: 'media/slide_07.jpg?v=1792982472' }
    ];

    let currentIndex = 0;
    let timerId = null;
    let progressTimer = null;
    let activeImageLayer = 'A';

    const imgLayerA = document.getElementById('image-layer-a');
    const imgLayerB = document.getElementById('image-layer-b');
    const progressBar = document.getElementById('progress-bar');

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('digital-clock').textContent = `${hours}:${minutes}`;

      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date = String(now.getDate()).padStart(2, '0');
      const dayName = days[now.getDay()];
      document.getElementById('date-display').textContent = `${year}.${month}.${date} (${dayName})`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // OLED 번인 방지 미세 픽셀 시프트 (10분마다)
    setInterval(() => {
      const header = document.getElementById('overlay-header');
      const offsetX = Math.floor(Math.random() * 7) - 3;
      const offsetY = Math.floor(Math.random() * 7) - 3;
      header.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
    }, 10 * 60 * 1000);

    function startProgressBar(durationMs) {
      if (!CONFIG.showProgressBar) return;
      clearInterval(progressTimer);
      const startTime = Date.now();
      progressBar.style.width = '0%';

      progressTimer = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const percent = Math.min((elapsed / durationMs) * 100, 100);
        progressBar.style.width = `${percent}%`;
        if (percent >= 100) clearInterval(progressTimer);
      }, 50);
    }

    function nextItem() {
      currentIndex = (currentIndex + 1) % PLAYLIST.length;
      playCurrentItem();
    }

    function playCurrentItem() {
      clearTimeout(timerId);
      clearInterval(progressTimer);

      if (!PLAYLIST || PLAYLIST.length === 0) return;
      const item = PLAYLIST[currentIndex];
      showImage(item.src);
    }

    function showImage(src) {
      const nextLayer = (activeImageLayer === 'A') ? imgLayerB : imgLayerA;
      const currentLayer = (activeImageLayer === 'A') ? imgLayerA : imgLayerB;

      nextLayer.src = src;
      nextLayer.onload = () => {
        nextLayer.classList.add('active');
        currentLayer.classList.remove('active');
        activeImageLayer = (activeImageLayer === 'A') ? 'B' : 'A';

        startProgressBar(CONFIG.imageDuration);
        timerId = setTimeout(nextItem, CONFIG.imageDuration);
      };

      nextLayer.onerror = () => {
        timerId = setTimeout(nextItem, 1500);
      };
    }

    // 마우스 3초 무반응 시 커서 숨김
    let mouseTimer = null;
    window.addEventListener('mousemove', () => {
      document.body.classList.remove('hide-cursor');
      clearTimeout(mouseTimer);
      mouseTimer = setTimeout(() => {
        document.body.classList.add('hide-cursor');
      }, 3000);
    });

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }
    window.addEventListener('dblclick', toggleFullScreen);

    setTimeout(() => {
      const hint = document.getElementById('fullscreen-hint');
      if (hint) {
        hint.style.opacity = '0';
        setTimeout(() => hint.remove(), 1000);
      }
    }, 8000);

    // 자동 새로고침 (새 사진 반영 & 캐시 방지)
    if (CONFIG.autoReloadMinutes > 0) {
      setInterval(() => {
        window.location.href = window.location.pathname + '?t=' + Date.now();
      }, CONFIG.autoReloadMinutes * 60 * 1000);
    }

    // =========================================================================
    // [LG TV 스크린세이버 / 화면 보호기 방지 3중 시스템]
    // =========================================================================

    // 1. 가상 비디오 스트림 무한 재생 (TV OS에 '동영상 시청 중' 신호 전달하여 화면 보호기 차단)
    function initKeepAliveVideo() {
      try {
        const kv = document.getElementById('keep-alive-video');
        const cvs = document.createElement('canvas');
        cvs.width = 4;
        cvs.height = 4;
        const ctx = cvs.getContext('2d');
        setInterval(() => {
          ctx.fillStyle = (ctx.fillStyle === '#000000') ? '#000001' : '#000000';
          ctx.fillRect(0, 0, 4, 4);
        }, 1000);

        if (cvs.captureStream) {
          kv.srcObject = cvs.captureStream(1);
          kv.play().catch(() => {});
        }
      } catch (e) {
        console.log('Keep-alive video init skipped:', e);
      }
    }

    // 2. Screen Wake Lock API (화면 꺼짐 방지 브라우저 표준)
    let wakeLockObj = null;
    async function requestScreenWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLockObj = await navigator.wakeLock.request('screen');
          wakeLockObj.addEventListener('release', () => {
            setTimeout(requestScreenWakeLock, 2000);
          });
        } catch (err) {}
      }
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestScreenWakeLock();
    });

    // 3. 주기적 가상 리모컨 / 키보드 입력 신호 발생 (2분마다 가상 입력 이벤트 발생)
    setInterval(() => {
      ['keydown', 'keyup'].forEach(eventType => {
        const ev = new KeyboardEvent(eventType, {
          key: 'Shift',
          code: 'ShiftRight',
          bubbles: true,
          cancelable: true
        });
        window.dispatchEvent(ev);
        document.dispatchEvent(ev);
      });

      const mouseEv = new MouseEvent('mousemove', {
        clientX: Math.floor(Math.random() * 20) + 10,
        clientY: Math.floor(Math.random() * 20) + 10,
        bubbles: true
      });
      window.dispatchEvent(mouseEv);
      document.dispatchEvent(mouseEv);

      const kv = document.getElementById('keep-alive-video');
      if (kv && kv.paused) {
        kv.play().catch(() => {});
      }
    }, 120000); // 2분마다 지속 실행

    window.onload = () => {
      playCurrentItem();
      initKeepAliveVideo();
      requestScreenWakeLock();
    };
  </script>
</body>
</html>
