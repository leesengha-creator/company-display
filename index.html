<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>사내 디지털 사이니지</title>
  <style>
    /* OLED 패널 최적화: 완벽한 블랙(#000) 배경으로 전력 절감 및 레터박스 일체화 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Pretendard", sans-serif;
    }

    body.hide-cursor {
      cursor: none;
    }

    #container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 사진 슬라이드 렌더러: 100% 풀스크린 3D 하드웨어 가속 슬라이드 모션 (TV 모션 센서 100% 인식) */
    .slide-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background-color: #000000;
      will-change: transform;
      transform: translate3d(100%, 0, 0); /* 기본 대기 상태: 화면 오른쪽 밖 */
      transition: transform 0.65s cubic-bezier(0.25, 1, 0.5, 1);
      image-rendering: -webkit-optimize-contrast;
      image-rendering: high-quality;
      z-index: 5;
    }

    .slide-layer.active {
      transform: translate3d(0, 0, 0) !important; /* 현재 표시: 화면 중앙 */
      z-index: 10;
    }

    .slide-layer.exit-left {
      transform: translate3d(-100%, 0, 0) !important; /* 퇴장: 화면 왼쪽 밖 */
      z-index: 5;
    }

    .slide-layer.no-transition {
      transition: none !important;
    }

    /* 상단 정보바 (로고/문구, 시계, 날짜) */
    #overlay-header {
      position: absolute;
      top: 24px;
      left: 32px;
      right: 32px;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      color: rgba(255, 255, 255, 0.88);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
      transition: transform 1s ease;
    }

    #logo-container {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    #clock-container {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    #digital-clock {
      font-size: 38px;
      font-weight: 700;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
    }

    #date-display {
      font-size: 16px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.72);
      margin-top: 4px;
    }

    /* 하단 진행 상태 바 (3초 표시) */
    #progress-bar-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background-color: rgba(255, 255, 255, 0.1);
      z-index: 100;
      pointer-events: none;
    }

    #progress-bar {
      width: 0%;
      height: 100%;
      background-color: #3b82f6;
      transition: width 0.1s linear;
    }

    #fullscreen-hint {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 1s;
    }
  </style>
</head>
<body>

  <div id="container">
    <img id="image-layer-a" class="slide-layer" alt="공지 이미지">
    <img id="image-layer-b" class="slide-layer" alt="공지 이미지">

    <!-- LG TV 스크린세이버 방지용 히든 엘리먼트 -->
    <div id="keepalive-box" style="position:fixed;bottom:0;right:0;width:1px;height:1px;opacity:0.01;pointer-events:none;z-index:9999;"></div>

    <div id="overlay-header">
      <div id="logo-container">🏢 사내 공지 게시판</div>
      <div id="clock-container">
        <div id="digital-clock">00:00</div>
        <div id="date-display">2026.00.00 (월)</div>
      </div>
    </div>

    <div id="progress-bar-container">
      <div id="progress-bar"></div>
    </div>

    <div id="fullscreen-hint" onclick="toggleFullScreen()">
      ⛶ 화면을 더블클릭하면 전체화면이 됩니다
    </div>
  </div>

  <script>
    const CONFIG = {
      imageDuration: 7000,   // 사진 7초 전환
      showClock: true,
      showProgressBar: true,
      autoReloadMinutes: 30, // 30분마다 자동 새로고침 (새 사진 반영 & 메모리 청소)
    };

    // 현재 등록된 사진 목록
    const PLAYLIST = [
      { type: 'image', src: 'media/slide_01.jpg?v=1792991260' },
      { type: 'image', src: 'media/slide_02.jpg?v=1792991260' },
      { type: 'image', src: 'media/slide_03.jpg?v=1792991260' },
      { type: 'image', src: 'media/slide_04.jpg?v=1792991260' },
      { type: 'image', src: 'media/slide_05.jpg?v=1792991260' },
      { type: 'image', src: 'media/slide_06.jpg?v=1792991260' },
      { type: 'image', src: 'media/slide_07.jpg?v=1792991260' }
    ];

    let currentIndex = 0;
    let timerId = null;
    let progressTimer = null;
    let activeImageLayer = 'A';

    const imgLayerA = document.getElementById('image-layer-a');
    const imgLayerB = document.getElementById('image-layer-b');
    const progressBar = document.getElementById('progress-bar');

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('digital-clock').textContent = `${hours}:${minutes}`;

      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date = String(now.getDate()).padStart(2, '0');
      const dayName = days[now.getDay()];
      document.getElementById('date-display').textContent = `${year}.${month}.${date} (${dayName})`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // OLED 번인 방지 미세 픽셀 시프트 (10분마다)
    setInterval(() => {
      const header = document.getElementById('overlay-header');
      const offsetX = Math.floor(Math.random() * 7) - 3;
      const offsetY = Math.floor(Math.random() * 7) - 3;
      header.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
    }, 10 * 60 * 1000);

    function startProgressBar(durationMs) {
      if (!CONFIG.showProgressBar) return;
      clearInterval(progressTimer);
      const startTime = Date.now();
      progressBar.style.width = '0%';

      progressTimer = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const percent = Math.min((elapsed / durationMs) * 100, 100);
        progressBar.style.width = `${percent}%`;
        if (percent >= 100) clearInterval(progressTimer);
      }, 50);
    }

    function nextItem() {
      currentIndex = (currentIndex + 1) % PLAYLIST.length;
      playCurrentItem();
    }

    function playCurrentItem() {
      clearTimeout(timerId);
      clearInterval(progressTimer);

      if (!PLAYLIST || PLAYLIST.length === 0) return;
      const item = PLAYLIST[currentIndex];
      showImage(item.src);
    }

    let isFirstLoad = true;

    function showImage(src) {
      const nextLayer = (activeImageLayer === 'A') ? imgLayerB : imgLayerA;
      const currentLayer = (activeImageLayer === 'A') ? imgLayerA : imgLayerB;

      nextLayer.src = src;
      nextLayer.onload = () => {
        if (isFirstLoad) {
          nextLayer.classList.remove('exit-left', 'no-transition');
          nextLayer.classList.add('active');
          activeImageLayer = (activeImageLayer === 'A') ? 'B' : 'A';
          isFirstLoad = false;
        } else {
          // 1. 다음 레이어를 오른쪽 밖(대기 위치)으로 즉시 이동 (트랜지션 끄기)
          nextLayer.classList.add('no-transition');
          nextLayer.classList.remove('active', 'exit-left');
          void nextLayer.offsetWidth; // 강제 리플로우 (GPU 렌더러 동기화)

          // 2. 트랜지션 다시 켜고 두 레이어 동시 슬라이드 이동!
          requestAnimationFrame(() => {
            nextLayer.classList.remove('no-transition');
            currentLayer.classList.remove('no-transition');

            currentLayer.classList.remove('active');
            currentLayer.classList.add('exit-left'); // 이전 사진: 왼쪽 밖으로

            nextLayer.classList.add('active');       // 새 사진: 오른쪽에서 중앙으로!

            activeImageLayer = (activeImageLayer === 'A') ? 'B' : 'A';
          });
        }

        // 상단 헤더도 사진 전환 시 미세 리액션 (고정 UI 오인 방지)
        const header = document.getElementById('overlay-header');
        if (header) {
          const ox = Math.floor(Math.random() * 6) - 3;
          const oy = Math.floor(Math.random() * 6) - 3;
          header.style.transform = `translate(${ox}px, ${oy}px)`;
        }

        startProgressBar(CONFIG.imageDuration);
        timerId = setTimeout(nextItem, CONFIG.imageDuration);
      };

      nextLayer.onerror = () => {
        timerId = setTimeout(nextItem, 1500);
      };
    }

    // 마우스 3초 무반응 시 커서 숨김
    let mouseTimer = null;
    window.addEventListener('mousemove', () => {
      document.body.classList.remove('hide-cursor');
      clearTimeout(mouseTimer);
      mouseTimer = setTimeout(() => {
        document.body.classList.add('hide-cursor');
      }, 3000);
    });

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }
    window.addEventListener('dblclick', toggleFullScreen);

    setTimeout(() => {
      const hint = document.getElementById('fullscreen-hint');
      if (hint) {
        hint.style.opacity = '0';
        setTimeout(() => hint.remove(), 1000);
      }
    }, 8000);

    // 자동 새로고침 (새 사진 반영 & 캐시 방지)
    if (CONFIG.autoReloadMinutes > 0) {
      setInterval(() => {
        window.location.href = window.location.pathname + '?t=' + Date.now();
      }, CONFIG.autoReloadMinutes * 60 * 1000);
    }

    // =========================================================================
    // [LG TV 리모컨 신호 & 화면 유지 에뮬레이터 (무해한 신호 45초 주기)]
    // =========================================================================

    // 1. 무음 오디오 핑 (TV OS에 미디어 활성 상태 전달)
    function playSilentAudioPing() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          gain.gain.value = 0.0001; // 들리지 않는 무음
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.1);
        }
      } catch (e) {}
    }

    // 2. 가상 물리 입력 신호 발생 (페이지 이동을 유발하지 않는 무해한 키만 전송)
    function simulateRemoteButtonPress() {
      // 무해한 Shift / Alt 키 신호만 전송 (Enter, Arrow 등 페이지 이동 키 배제)
      ['keydown', 'keyup'].forEach(evtType => {
        try {
          const ev = new KeyboardEvent(evtType, {
            key: 'Shift',
            code: 'ShiftRight',
            keyCode: 16,
            which: 16,
            bubbles: true,
            cancelable: true
          });
          window.dispatchEvent(ev);
          document.dispatchEvent(ev);
        } catch (e) {}
      });

      // 마우스 미세 이동 신호
      try {
        const mouseEv = new MouseEvent('mousemove', {
          clientX: Math.floor(Math.random() * 20) + 5,
          clientY: Math.floor(Math.random() * 20) + 5,
          bubbles: true
        });
        window.dispatchEvent(mouseEv);
      } catch (e) {}

      // 무음 오디오 핑
      playSilentAudioPing();
    }

    // 45초마다 리모컨 신호 전송
    setInterval(simulateRemoteButtonPress, 45000);

    // Screen Wake Lock API
    async function requestScreenWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          const lock = await navigator.wakeLock.request('screen');
          lock.addEventListener('release', () => setTimeout(requestScreenWakeLock, 2000));
        } catch (err) {}
      }
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestScreenWakeLock();
    });

    // 슬라이드쇼 정지 방지 워치독 (혹시 15초 이상 사진이 안 넘어가면 강제 복구)
    setInterval(() => {
      const currentActive = document.querySelector('.media-item.active');
      if (!currentActive) {
        playCurrentItem();
      }
    }, 15000);

    window.onload = () => {
      playCurrentItem();
      requestScreenWakeLock();
      setTimeout(simulateRemoteButtonPress, 3000);
    };
  </script>
</body>
</html>
